<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>视频导出 - AI NovelSpeaker V2</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="main-nav" id="mainNav"></aside>
      <main class="page">
        <header class="page-header">
          <div>
            <h1>章回视频导出</h1>
            <p class="meta">后端离线渲染 9:16 竖屏或 16:9 横屏 / 30fps MP4，单 Worker 串行处理。</p>
          </div>
          <div class="header-actions">
            <label class="header-novel-switch">切换小说
              <select id="videoExportNovelSelect"></select>
            </label>
            <label class="header-novel-switch video-export-filter-label">状态
              <select id="videoExportStatusFilter">
                <option value="">全部</option>
                <option value="pending">等待</option>
                <option value="running">运行中</option>
                <option value="completed">完成</option>
                <option value="failed">失败</option>
                <option value="cancelled">已取消</option>
              </select>
            </label>
            <label class="header-novel-switch video-export-filter-label video-export-size-filter-label">画幅
              <select id="videoExportSizeFilter">
                <option value="">全部</option>
                <option value="1080x1920">9:16竖屏1080x1920</option>
                <option value="1920x1080">16:9横屏1920x1080</option>
              </select>
            </label>
            <label class="header-novel-switch video-export-filter-label">字幕
              <select id="videoExportSubtitleFilter">
                <option value="">全部</option>
                <option value="srt">有</option>
                <option value="none">无</option>
              </select>
            </label>
            <label class="header-novel-switch video-export-filter-label">自动刷新
              <select id="videoExportRefreshIntervalSelect">
                <option value="0">不刷新</option>
                <option value="3">3秒</option>
                <option value="5">5秒</option>
                <option value="10">10秒</option>
                <option value="30">30秒</option>
              </select>
            </label>
            <span id="videoExportWorkerStatus" class="meta">Worker: -</span>
            <button id="restartVideoExportWorkerBtn" class="ghost-btn" type="button">重启Worker</button>
            <button id="refreshVideoExportTasksBtn" class="primary-btn" type="button">刷新队列</button>
          </div>
        </header>

        <section class="panel">
          <div class="panel-head">
            <h2>导出任务</h2>
            <div class="video-export-task-head-actions">
              <button id="videoExportCoverBundleBtn" class="ghost-btn" type="button">下载所有封面</button>
              <select id="videoExportSortBySelect" class="video-export-sort-select" aria-label="排序依据" title="排序依据">
                <option value="id">ID</option>
                <option value="chapterNum">编号</option>
                <option value="chapterTitle">章回标题</option>
              </select>
              <button id="videoExportSortOrderBtn" class="ghost-btn icon-btn video-export-sort-btn" type="button" aria-label="按 ID 降序排列" title="按 ID 降序排列"></button>
              <span id="videoExportSummary" class="queue-summary-badge">0 个任务</span>
            </div>
          </div>
          <div id="videoExportTaskList" class="task-detail-content"></div>
        </section>
      </main>
    </div>

    <dialog id="videoExportPlayerDialog" class="video-player-dialog">
      <div class="video-player-dialog-head">
        <div>
          <h2 id="videoExportPlayerTitle">播放视频</h2>
          <p id="videoExportPlayerMeta" class="meta"></p>
        </div>
        <button id="videoExportPlayerCloseBtn" class="ghost-btn" type="button">关闭</button>
      </div>
      <video id="videoExportPlayer" controls playsinline preload="metadata"></video>
    </dialog>

    <dialog id="videoExportCoverDialog" class="video-cover-dialog">
      <div class="video-player-dialog-head">
        <div>
          <h2 id="videoExportCoverTitle">预览封面</h2>
          <p id="videoExportCoverMeta" class="meta"></p>
        </div>
        <div class="video-cover-head-actions">
          <button id="videoExportCoverPrevBtn" class="ghost-btn" type="button">前一个</button>
          <button id="videoExportCoverNextBtn" class="ghost-btn" type="button">后一个</button>
          <button id="videoExportCoverSetBtn" class="ghost-btn" type="button">设为封面</button>
          <a id="videoExportCoverDownloadBtn" class="primary-btn" href="#" download>下载封面</a>
          <button id="videoExportCoverCloseBtn" class="ghost-btn" type="button">关闭</button>
        </div>
      </div>
      <div class="video-cover-controls">
        <label>底图
          <select id="videoExportCoverImageSelect"></select>
        </label>
        <span id="videoExportCoverImageMeta" class="meta"></span>
      </div>
      <img id="videoExportCoverPreview" class="video-cover-preview" alt="视频封面预览" />
    </dialog>

    <dialog id="videoExportCoverBundleDialog" class="video-cover-bundle-dialog">
      <div class="video-player-dialog-head">
        <div>
          <h2>下载所有封面</h2>
          <p id="videoExportCoverBundleMeta" class="meta">将当前小说已完成的视频封面打包为 ZIP。</p>
        </div>
        <button id="videoExportCoverBundleCloseBtn" class="ghost-btn" type="button">关闭</button>
      </div>
      <div class="video-cover-bundle-body">
        <button id="videoExportCoverBundleStartBtn" class="primary-btn" type="button">打包封面</button>
        <div id="videoExportCoverBundleProgressWrap" class="video-cover-bundle-progress hidden">
          <div class="progress-row"><span id="videoExportCoverBundleProgressBar" style="width:0%"></span></div>
          <p id="videoExportCoverBundleStatus" class="meta">等待打包</p>
        </div>
        <a id="videoExportCoverBundleDownloadLink" class="primary-btn hidden" href="#" download>下载 ZIP</a>
      </div>
    </dialog>

    <dialog id="youtubeUploadDialog" class="video-cover-bundle-dialog youtube-upload-dialog">
      <div class="video-player-dialog-head">
        <div>
          <h2>上传油管</h2>
          <p id="youtubeUploadMeta" class="meta"></p>
        </div>
        <button id="youtubeUploadCloseBtn" class="ghost-btn" type="button">关闭</button>
      </div>
      <div class="settings-grid social-settings-grid">
        <label>标题规则
          <input id="youtubeUploadTitle" type="text" />
        </label>
        <label>播放列表
          <div class="inline-field-row">
            <select id="youtubeUploadPlaylistSelect"></select>
            <button id="youtubeUploadLoadPlaylistsBtn" class="ghost-btn btn-sm" type="button">刷新</button>
          </div>
        </label>
        <label>标签
          <input id="youtubeUploadTags" type="text" />
        </label>
        <label>保存或发布
          <select id="youtubeUploadPrivacy">
            <option value="private">私享</option>
            <option value="unlisted">不公开</option>
            <option value="public">公开</option>
          </select>
        </label>
      </div>
      <div class="task-detail-block compact-block">
        <p><strong>视频封面：</strong><span id="youtubeUploadCoverText">使用设置的封面</span></p>
        <img id="youtubeUploadCoverPreview" class="youtube-upload-cover-preview" alt="视频封面" />
        <p><strong>观众：</strong>不，内容不是面向儿童的</p>
        <p><strong>AI 使用情况：</strong>是</p>
        <p><strong>语言和字幕认证：</strong>视频语言：中文；字幕认证：该内容从未在美国的电视媒体上播出过。</p>
        <p><strong>录制日期：</strong><span id="youtubeUploadRecordDate"></span></p>
        <p><strong>字幕：</strong><span id="youtubeUploadSubtitleText"></span></p>
      </div>
      <div class="actions-row">
        <button id="youtubeUploadSubmitBtn" class="primary-btn" type="button">上传</button>
      </div>
    </dialog>

    <div id="toast" class="toast"></div>
    <script type="module" src="./assets/video-export.js"></script>
  </body>
</html>
