<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>社交媒体 - AI NovelSpeaker V2</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="main-nav" id="mainNav"></aside>
      <main class="page">
        <header class="page-header">
          <div>
            <h1>社交媒体</h1>
            <p class="meta">配置第三方平台上传参数和凭据。</p>
          </div>
          <div class="header-actions">
            <span id="socialUploadWorkerStatus" class="meta">上传Worker: -</span>
            <button id="restartSocialUploadWorkerBtn" class="ghost-btn" type="button">重启上传Worker</button>
            <button id="refreshSocialMediaBtn" class="ghost-btn" type="button">刷新</button>
          </div>
        </header>

        <section class="panel social-media-panel">
          <div class="tab-row">
            <button class="tab-btn active" type="button">油管</button>
          </div>
          <div class="google-oauth-example-carousel" aria-label="Google 配置示例轮播">
            <div class="google-oauth-example-head">
              <div>
                <strong>Google 配置示例</strong>
                <p class="meta">按示例完成 Branding、Audience、Clients、Data Access 和 YouTube API 配额配置。</p>
              </div>
              <div class="google-oauth-example-controls">
                <button id="googleOauthExamplePrevBtn" class="ghost-btn btn-sm" type="button">上一张</button>
                <span id="googleOauthExampleCounter" class="meta">1 / 7</span>
                <button id="googleOauthExampleNextBtn" class="ghost-btn btn-sm" type="button">下一张</button>
              </div>
            </div>
            <div class="google-oauth-example-stage">
              <img id="googleOauthExampleImage" src="./assets/google-oauth-examples/01.png" alt="Google 配置示例 1" />
              <p id="googleOauthExampleFallback" class="empty-text hidden">未找到示例图片。请将图片放到 assets/google-oauth-examples/01.png 到 07.png。</p>
            </div>
            <div id="googleOauthExampleDots" class="google-oauth-example-dots" aria-label="示例图片分页"></div>
          </div>
          <div class="settings-grid social-settings-grid">
            <div class="youtube-file-upload-row">
              <div>
                <strong>client_secret.json</strong>
                <p id="youtubeClientSecretPathText" class="meta">未上传</p>
              </div>
              <label class="ghost-btn btn-sm file-upload-btn">上传文件
                <input id="youtubeClientSecretFile" type="file" accept="application/json,.json" hidden />
              </label>
            </div>
            <label>Client ID
              <input id="youtubeClientId" type="text" placeholder="上传 client_secret.json 后自动填充" />
            </label>
            <label>Client secret
              <input id="youtubeClientSecret" type="password" placeholder="上传 client_secret.json 后自动填充" />
            </label>
            <label>Redirect URI
              <input id="youtubeRedirectUri" type="text" value="http://localhost:8080/oauth" />
            </label>
            <label>标签配置
              <input id="youtubeDefaultTags" type="text" />
            </label>
            <label class="youtube-proxy-row">代理
              <span class="youtube-proxy-toggle"><input id="youtubeProxyEnabled" type="checkbox" /> 开启</span>
              <input id="youtubeProxyUrl" type="text" value="http://127.0.0.1:7897" />
            </label>
          </div>
          <div class="actions-row">
            <button id="saveYoutubeSettingsBtn" class="primary-btn" type="button">保存配置</button>
            <button id="youtubeAuthorizeBtn" class="ghost-btn" type="button">授权生成</button>
            <button id="loadYoutubePlaylistsBtn" class="ghost-btn" type="button">拉取油管播放列表</button>
            <a id="youtubeQuotaLink" class="ghost-btn hidden" href="#" target="_blank" rel="noopener noreferrer">查看额度</a>
          </div>
          <h3>油管播放列表</h3>
          <div id="youtubePlaylists" class="task-detail-content"><p class="empty-text">尚未拉取。</p></div>
        </section>
      </main>
    </div>
    <dialog id="googleOauthExamplePreviewDialog" class="google-oauth-preview-dialog">
      <div class="google-oauth-preview-head">
        <strong>Google 配置示例</strong>
        <span id="googleOauthExamplePreviewCounter" class="meta">1 / 7</span>
        <button id="googleOauthExamplePreviewCloseBtn" class="dialog-close-btn" type="button" aria-label="关闭">×</button>
      </div>
      <div class="google-oauth-preview-stage">
        <button id="googleOauthExamplePreviewPrevBtn" class="google-oauth-preview-nav" type="button" aria-label="上一张" title="上一张">‹</button>
        <img id="googleOauthExamplePreviewImage" alt="Google 配置示例大图" />
        <button id="googleOauthExamplePreviewNextBtn" class="google-oauth-preview-nav" type="button" aria-label="下一张" title="下一张">›</button>
      </div>
    </dialog>
    <div id="toast" class="toast"></div>
    <script type="module" src="./assets/social-media.js"></script>
  </body>
</html>
