<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI NovelSpeaker V2 - ComfyUI工作流</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="main-nav" id="mainNav"></aside>
      <main class="page">
        <header class="page-header">
          <div>
            <p class="eyebrow">工作流资产</p>
            <h1>ComfyUI 工作流管理</h1>
          </div>
          <div class="header-actions">
            <button class="primary-btn" id="createWorkflowBtn" type="button">创建工作流</button>
          </div>
        </header>
        <section class="panel">
          <div class="panel-head">
            <h2>工作流列表</h2>
          </div>
          <div id="workflowTypeTabs" class="json-view-tabs workflow-type-tabs">
            <button class="ghost-btn active" data-workflow-tab="voice_sample" type="button">生成示例音频</button>
            <button class="ghost-btn" data-workflow-tab="line_audio" type="button">生成台词音频</button>
            <button class="ghost-btn" data-workflow-tab="voice_transcribe" type="button">提取声音文本</button>
            <button class="ghost-btn" data-workflow-tab="audio_asr" type="button">提取音频ASR</button>
          </div>
          <div id="workflowList" class="asset-list"></div>
        </section>
      </main>
    </div>

    <dialog id="workflowModal" class="modal">
      <form id="workflowForm" method="dialog">
        <h3 id="workflowModalTitle">创建工作流</h3>
        <div class="form-grid">
          <label>名称<input name="name" required /></label>
          <label>工作流类型
            <select name="workflowType" required>
              <option value="">请选择</option>
              <option value="voice_transcribe">提取声音文本</option>
              <option value="audio_asr">提取音频ASR</option>
              <option value="line_audio">生成台词音频</option>
              <option value="voice_sample">生成示例音频</option>
            </select>
          </label>
          <label class="full">描述<input name="description" /></label>
          <label class="full">工作流JSON<textarea name="jsonText" rows="10" required></textarea></label>
          <section class="full workflow-io-panel">
            <div class="panel-head compact">
              <h4>配置输入输出</h4>
              <span id="workflowIoHint" class="meta">系统工作流使用默认配置，自定义工作流可编辑</span>
            </div>
            <div id="workflowIoConfig" class="workflow-io-grid"></div>
          </section>
        </div>
        <menu>
          <button class="ghost-btn" id="workflowCancelBtn" type="button">取消</button>
          <button class="primary-btn" id="workflowSaveBtn" type="submit">保存</button>
        </menu>
      </form>
    </dialog>

    <div id="toast" class="toast"></div>
    <script type="module" src="./assets/workflows.js"></script>
  </body>
  </html>
