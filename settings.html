<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI NovelSpeaker V2 - 系统配置</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="main-nav" id="mainNav"></aside>
      <main class="page">
        <header class="page-header">
          <div>
            <p class="eyebrow">系统连接</p>
            <h1>模型与服务配置</h1>
          </div>
        </header>

        <section class="panel form-panel">
          <h2>ComfyUI</h2>
          <label>ComfyUI 地址<input id="comfyUrl" placeholder="http://127.0.0.1:8188" /></label>
          <div class="test-row">
            <button class="ghost-btn" id="testComfyBtn" type="button">测试 ComfyUI</button>
            <span id="testComfyResult" class="test-result">未测试</span>
          </div>
        </section>

        <section class="panel form-panel">
          <h2>LLM配置</h2>
          <div class="form-grid">
            <label>
              提供商
              <select id="llmProvider">
                <option value="grok">Grok</option>
                <option value="deepseek">DeepSeek</option>
                <option value="qwen">千问</option>
                <option value="gemini">Gemini</option>
                <option value="openai">OpenAI</option>
                <option value="ollama">本地 Ollama</option>
                <option value="custom">自定义API</option>
              </select>
            </label>
            <label>API Base URL<input id="llmBase" /></label>
            <label>模型名称<input id="llmModel" /></label>
            <label id="llmKeyWrap">API Key<input id="llmKey" type="password" /><span id="llmKeyHint" class="caption hidden">本地 Ollama 可留空</span></label>
            <label>Temperature<input id="llmTemperature" type="number" min="0" max="2" step="0.1" /></label>
            <label>Max Tokens<input id="llmTokens" type="number" min="128" step="1" /></label>
            <label id="llmNumCtxWrap">
              num_ctx
              <select id="llmNumCtx">
                <option value="32768">32K</option>
                <option value="65536">64K</option>
                <option value="98304">96K</option>
                <option value="131072">128K</option>
              </select>
            </label>
            <label id="llmKeepAliveWrap">
              keep_alive
              <div class="keep-alive-row">
                <select id="llmKeepAlive">
                  <option value="5m">5m</option>
                  <option value="15m">15m</option>
                  <option value="30m">30m</option>
                  <option value="1h">1h</option>
                  <option value="6h">6h</option>
                  <option value="24h">24h</option>
                </select>
                <div id="llmUnloadAfterCallWrap" class="inline-check keep-alive-inline-check">
                  <input id="llmUnloadAfterCall" type="checkbox" />
                  <label for="llmUnloadAfterCall">调用后卸载模型，清空上下文</label>
                </div>
              </div>
            </label>
            <label>
              每批最多处理文本字数
              <select id="llmBatchChars">
                <option value="0">不限制</option>
                <option value="3500">3500 [最保险]</option>
                <option value="4000">4000</option>
                <option value="5000">5000</option>
                <option value="6000">6000</option>
                <option value="7000">7000 [grok模型支持]</option>
                <option value="8000">8000</option>
                <option value="9000">9000</option>
                <option value="10000">10000</option>
              </select>
            </label>
            <label>
              每批超时
              <select id="llmBatchTimeoutMinutes">
                <option value="5">5分钟</option>
                <option value="10">10分钟</option>
                <option value="15">15分钟</option>
                <option value="20">20分钟</option>
                <option value="30">30分钟</option>
                <option value="40">40分钟</option>
              </select>
            </label>
            <label id="llmThinkWrap" class="form-toggle-field">
              <span>Think</span>
              <div class="switch-row">
                <input id="llmThink" type="checkbox" checked />
                <span>开启</span>
              </div>
              <span id="llmThinkHint" class="caption">仅本地 Ollama 生效，默认开启</span>
            </label>
            <label class="full">代理 Proxy URL<input id="proxyUrl" placeholder="留空则继承环境代理；如需显式指定可填 http://127.0.0.1:7890" /></label>
          </div>
          <div class="test-row">
            <button class="ghost-btn" id="testLlmBtn" type="button">测试 LLM</button>
            <span id="testLlmResult" class="test-result">未测试</span>
          </div>
          <p class="caption">支持 Grok / DeepSeek / 千问 / Gemini / OpenAI / 本地 Ollama / 自定义 API。</p>
        </section>

        <section class="panel form-panel">
          <h2>界面设置</h2>
          <div class="form-grid">
            <label>
              语言设置
              <select id="uiLanguage">
                <option value="zh-CN">简体中文</option>
                <option value="zh-TW">繁體中文</option>
                <option value="en-US">English</option>
                <option value="ja-JP">日本語</option>
                <option value="ko-KR">한국어</option>
              </select>
            </label>
            <label>
              时区设置
              <select id="uiTimezone">
                <option value="Asia/Shanghai">北京时间 (Asia/Shanghai)</option>
                <option value="Asia/Hong_Kong">香港时间 (Asia/Hong_Kong)</option>
                <option value="Asia/Tokyo">东京时间 (Asia/Tokyo)</option>
                <option value="Asia/Seoul">首尔时间 (Asia/Seoul)</option>
                <option value="America/New_York">纽约时间 (America/New_York)</option>
                <option value="America/Los_Angeles">洛杉矶时间 (America/Los_Angeles)</option>
                <option value="Europe/London">伦敦时间 (Europe/London)</option>
                <option value="Europe/Paris">巴黎时间 (Europe/Paris)</option>
                <option value="Australia/Sydney">悉尼时间 (Australia/Sydney)</option>
                <option value="UTC">UTC (协调世界时)</option>
              </select>
            </label>
          </div>
          <p class="caption">保存后影响任务列表等页面的时间显示格式与时区。</p>
        </section>

        <section class="panel form-panel">
          <h2>台词队列任务执行设置</h2>
          <div class="form-grid">
            <label>
              执行方式
              <select id="lineAudioQueueMode">
                <option value="immediate">立即执行</option>
                <option value="scheduled">指定时间执行</option>
              </select>
            </label>
            <label id="lineAudioQueueTimeWrap" class="hidden">
              指定时间
              <input id="lineAudioQueueScheduledAt" type="datetime-local" />
            </label>
          </div>
          <p class="caption">台词预览页点击“生成音频 / 批量生成所有”时，将按这里的设置进入台词队列。</p>
        </section>

        <section class="panel form-panel">
          <h2>版权音频申明</h2>
          <div class="copyright-audio-grid">
            <div class="copyright-audio-item">
              <div class="copyright-audio-head copyright-audio-inline">
                <strong>章回开头</strong>
                <div class="audio-upload-row copyright-audio-actions-row">
                  <label class="switch-row"><input id="copyrightIntroEnabled" type="checkbox" /> <span>开启</span></label>
                  <input id="copyrightIntroFile" type="file" accept="audio/*,.flac,.wav,.mp3,.m4a,.aac" class="hidden" />
                  <button id="uploadCopyrightIntroBtn" class="ghost-btn" type="button">上传</button>
                  <audio id="copyrightIntroPlayer" controls class="hidden"></audio>
                  <span id="copyrightIntroStatus" class="caption"></span>
                </div>
              </div>
            </div>
            <div class="copyright-audio-item">
              <div class="copyright-audio-head copyright-audio-inline">
                <strong>章回结尾</strong>
                <div class="audio-upload-row copyright-audio-actions-row">
                  <label class="switch-row"><input id="copyrightOutroEnabled" type="checkbox" /> <span>开启</span></label>
                  <input id="copyrightOutroFile" type="file" accept="audio/*,.flac,.wav,.mp3,.m4a,.aac" class="hidden" />
                  <button id="uploadCopyrightOutroBtn" class="ghost-btn" type="button">上传</button>
                  <audio id="copyrightOutroPlayer" controls class="hidden"></audio>
                  <span id="copyrightOutroStatus" class="caption"></span>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="settings-actions-bottom">
          <button class="primary-btn" id="saveSettingsBtn" type="button">保存配置</button>
        </section>
      </main>
    </div>

    <div id="toast" class="toast"></div>
    <script type="module" src="./assets/settings.js"></script>
  </body>
  </html>
