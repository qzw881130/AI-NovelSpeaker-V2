<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI NovelSpeaker V2 - 小说管理</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="main-nav" id="mainNav"></aside>
      <main class="page">
        <header class="page-header">
          <div>
            <h1>小说管理中心</h1>
          </div>
          <div class="header-middle-refresh">
            <label for="autoRefreshSelect" class="eyebrow">自动刷新</label>
            <select id="autoRefreshSelect">
              <option value="0" selected>不刷新</option>
              <option value="5">5秒</option>
              <option value="20">20秒</option>
              <option value="60">1分钟</option>
            </select>
          </div>
          <div class="header-actions">
            <button class="ghost-btn" id="createNovelBtn" type="button">创建小说</button>
          </div>
        </header>

        <section class="hero-grid">
          <article class="hero-card">
            <h2>项目统计</h2>
            <div class="hero-metrics project-metrics" id="projectMetrics"></div>
          </article>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>小说列表</h2>
            <div class="toolbar">
              <input id="novelKeyword" type="search" placeholder="搜索小说名 / 作者" />
              <select id="novelSort">
                <option value="updated">按最近更新</option>
                <option value="chapters">按章节数</option>
                <option value="words">按总字数</option>
              </select>
            </div>
          </div>
          <div id="novelGrid" class="novel-grid"></div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>文件存储统计</h2>
            <div class="panel-head-actions">
              <button id="toggleStorageTableBtn" class="ghost-btn" type="button" aria-expanded="true">折叠</button>
            </div>
          </div>
          <div id="storageTable" class="storage-table"></div>
        </section>
      </main>
    </div>

    <dialog id="novelModal" class="modal">
      <form id="novelForm" method="dialog">
        <h3 id="novelModalTitle">创建小说</h3>
        <div class="form-grid">
          <label>
            小说名
            <input name="name" required />
          </label>
          <label>
            作者
            <input name="author" required />
          </label>
          <label>
            英文目录
            <input
              name="englishDir"
              required
              maxlength="25"
              pattern="[A-Za-z0-9_]{1,25}"
              title="仅允许大小写英文、数字、下划线，且不超过25字符"
              placeholder="classic_shz"
            />
          </label>
          <label>
            JSON 解析提示词
            <select name="promptId" id="novelPromptSelect"></select>
          </label>
          <label>
            NSFW 审查提示词
            <select name="nsfwPromptId" id="novelNsfwPromptSelect"></select>
          </label>
          <label>
            插画-scene提示词
            <select name="illustrationScenePromptId" id="novelIllustrationScenePromptSelect"></select>
          </label>
          <label>
            插画-shot提示词
            <select name="illustrationShotPromptId" id="novelIllustrationShotPromptSelect"></select>
          </label>
          <label>
            插画-prompt提示词
            <select name="illustrationPromptPromptId" id="novelIllustrationPromptPromptSelect"></select>
          </label>
          <label>
            生成插画工作流
            <select name="workflowId" id="illustrationWorkflowSelect"></select>
          </label>
          <label>
            生成示例音频工作流
            <select name="voiceSampleWorkflowId" id="voiceSampleWorkflowSelect"></select>
          </label>
          <label>
            生成台词音频工作流
            <select name="lineAudioWorkflowId" id="lineAudioWorkflowSelect"></select>
          </label>
          <label>
            提取声音文本工作流
            <select name="voiceTranscribeWorkflowId" id="voiceTranscribeWorkflowSelect"></select>
          </label>
          <label>
            提取音频ASR工作流
            <select name="audioAsrWorkflowId" id="audioAsrWorkflowSelect"></select>
          </label>
          <label class="full">
            简介
            <textarea name="intro" rows="3" required></textarea>
          </label>
        </div>
        <menu>
          <button value="cancel" class="ghost-btn" type="button" id="novelCancelBtn">取消</button>
          <button value="default" class="primary-btn" type="submit">保存</button>
        </menu>
      </form>
    </dialog>

    <dialog id="bundleModal" class="modal">
      <form method="dialog">
        <h3 id="bundleModalTitle">打包下载</h3>
        <label>
          音频格式
          <select id="bundleAudioPresetSelect">
            <option value="lossless">无损格式</option>
            <option value="mp3-128k">MP3 128k【高音质】</option>
            <option value="mp3-96k">MP3 96k【推荐】</option>
            <option value="mp3-64k">MP3 64k【有声书最佳平衡】</option>
            <option value="mp3-48k-mono">MP3 48k Mono【老人机神器】</option>
          </select>
        </label>
        <label>
          版权版本
          <select id="bundleAudioVariantSelect">
            <option value="ver">有版权</option>
            <option value="nonver">无版权</option>
          </select>
        </label>
        <div id="bundleEstimateMeta" class="bundle-estimate-wrap"></div>
        <div id="bundleList" class="bundle-list"></div>
        <menu>
          <button id="bundleCreateBtn" class="primary-btn" type="button">打包</button>
          <button id="bundleCloseBtn" class="ghost-btn" type="submit">关闭</button>
        </menu>
      </form>
    </dialog>

    <div id="toast" class="toast"></div>
    <script type="module" src="./assets/index.js"></script>
  </body>
  </html>
