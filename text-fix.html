<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI NovelSpeaker V2 - 修复文本</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="main-nav" id="mainNav"></aside>
      <main class="page text-fix-page">
        <header class="page-header">
          <div>
            <p class="eyebrow">文本修复</p>
            <h1>修复文本</h1>
            <p id="textFixMeta" class="meta">-</p>
          </div>
          <div class="header-actions">
            <label class="header-novel-switch">切换小说
              <select id="textFixNovelSelect"></select>
            </label>
            <button id="textFixRefreshBtn" class="ghost-btn" type="button">刷新</button>
          </div>
        </header>

        <section class="panel">
          <div class="panel-head">
            <h2>查找与替换</h2>
            <span id="textFixSummary" class="meta">尚未搜索</span>
          </div>
          <div class="form-grid text-fix-controls">
            <label>
              搜索文本
              <input id="textFixSearchInput" placeholder="输入要搜索的文本" />
            </label>
            <label>
              替换文本
              <input id="textFixReplaceInput" placeholder="输入替换后的文本" />
            </label>
            <div class="card-actions top-actions text-fix-actions">
              <button id="textFixSearchBtn" class="ghost-btn" type="button">搜索</button>
              <button id="textFixReplaceAllBtn" class="primary-btn" type="button">替换全部</button>
              <button id="textFixReplaceJsonBtn" class="ghost-btn" type="button">替换JSON</button>
              <button id="textFixReplaceTxtBtn" class="ghost-btn" type="button">替换TXT</button>
            </div>
          </div>
        </section>

        <section class="panel text-fix-results-panel">
          <div class="panel-head">
            <h2>搜索结果</h2>
            <span id="textFixCount" class="meta">共 0 处</span>
          </div>
          <div id="textFixResultList" class="asset-list"></div>
        </section>
      </main>
    </div>
    <div id="toast" class="toast"></div>
    <script type="module" src="./assets/text-fix.js"></script>
  </body>
</html>
