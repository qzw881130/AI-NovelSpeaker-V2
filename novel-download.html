<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小说下载 - AI NovelSpeaker V2</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="main-nav" id="mainNav"></aside>
      <main class="page">
        <header class="page-header">
          <div>
            <h1 id="novelDownloadPageTitle">小说下载</h1>
            <p id="novelDownloadPageMeta" class="meta">加载中...</p>
          </div>
          <div class="header-actions">
            <label class="header-novel-switch">切换小说
              <select id="novelDownloadNovelSelect"></select>
            </label>
            <a id="novelDownloadRolesLink" class="ghost-btn" href="./roles.html">返回角色库</a>
            <a id="novelDownloadChaptersLink" class="ghost-btn" href="./chapters.html">返回章节管理</a>
            <button id="refreshNovelDownloadBtn" class="primary-btn" type="button">刷新</button>
          </div>
        </header>

        <section class="panel">
          <div class="panel-head">
            <div class="panel-head-title-row">
              <h2>章回音频下载</h2>
              <span id="novelDownloadSelectionMeta" class="meta">已选择 0 回</span>
            </div>
            <div class="panel-head-actions">
              <span id="batchMergeProgress" class="meta hidden">0/0</span>
              <button id="batchMergeAudioBtn" class="ghost-btn" type="button">批量合并音频</button>
              <span id="novelDownloadSummary" class="meta">-</span>
            </div>
          </div>
          <div class="roles-table-wrap novel-download-table-wrap">
            <table class="roles-table novel-download-table">
              <thead>
                <tr>
                  <th>
                    <label class="inline-check novel-download-select-all">
                      <input id="novelDownloadSelectAll" type="checkbox" />
                      <span>选择全部</span>
                    </label>
                  </th>
                  <th>章回编号</th>
                  <th>章回标题</th>
                  <th>
                    <button id="sortWordCountBtn" class="table-sort-btn" type="button">
                      <span>字数</span>
                      <span id="sortWordCountIcon" class="table-sort-icon">↕</span>
                    </button>
                  </th>
                  <th>
                    <button id="sortDurationBtn" class="table-sort-btn" type="button">
                      <span>音频时长</span>
                      <span id="sortDurationIcon" class="table-sort-icon">↕</span>
                    </button>
                  </th>
                  <th>
                    <button id="sortSizeBtn" class="table-sort-btn" type="button">
                      <span>音频大小</span>
                      <span id="sortSizeIcon" class="table-sort-icon">↕</span>
                    </button>
                  </th>
                  <th>下载</th>
                </tr>
              </thead>
              <tbody id="novelDownloadTableBody">
                <tr>
                  <td colspan="7" class="empty-text">正在加载...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast"></div>
    <script type="module" src="./assets/novel-download.js"></script>
  </body>
</html>
