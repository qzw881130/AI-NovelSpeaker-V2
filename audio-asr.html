<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>提取音频ASR - AI NovelSpeaker V2</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="main-nav" id="mainNav"></aside>
      <main class="page">
        <header class="page-header">
          <div>
            <h1 id="audioAsrPageTitle">提取音频ASR</h1>
            <p id="audioAsrPageMeta" class="meta">加载中...</p>
          </div>
          <div class="header-actions">
            <label class="header-novel-switch">切换小说
              <select id="audioAsrNovelSelect"></select>
            </label>
            <a id="audioAsrChaptersLink" class="ghost-btn" href="./chapters.html">返回章节管理</a>
            <div class="header-inline-tools">
              <span id="audioAsrWorkerStatus" class="meta">Worker: -</span>
              <button id="restartAudioAsrTaskWorkerBtn" class="ghost-btn" type="button">重启任务Worker</button>
              <button id="refreshAudioAsrBtn" class="primary-btn" type="button">刷新</button>
            </div>
          </div>
        </header>

        <section class="panel">
          <div class="panel-head">
            <div class="panel-head-title-row">
              <h2>章回音频ASR</h2>
              <span id="audioAsrSelectionMeta" class="meta">已选择 0 回</span>
            </div>
            <div class="panel-head-actions">
              <button id="audioAsrBatchBtn" class="ghost-btn" type="button">批量提取</button>
              <button id="audioAsrBatchAllBtn" class="ghost-btn" type="button">提取全部</button>
              <span id="audioAsrSummary" class="meta">-</span>
            </div>
          </div>
          <div class="roles-table-wrap novel-download-table-wrap">
            <table class="roles-table novel-download-table">
              <thead>
                <tr>
                  <th>
                    <label class="inline-check novel-download-select-all">
                      <input id="audioAsrSelectAll" type="checkbox" />
                      <span>选择全部</span>
                    </label>
                  </th>
                  <th>章回编号</th>
                  <th>章回标题</th>
                  <th>音频时长</th>
                  <th>ASR状态</th>
                  <th>ASR文件</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="audioAsrTableBody">
                <tr>
                  <td colspan="7" class="empty-text">正在加载...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <dialog id="audioAsrViewDialog" class="modal modal-large">
      <form method="dialog">
        <div class="dialog-header">
          <h3 id="audioAsrViewTitle">查看ASR</h3>
          <button class="dialog-close-btn" type="submit" aria-label="关闭">×</button>
        </div>
        <pre id="audioAsrViewContent" class="dialog-code-block">加载中...</pre>
      </form>
    </dialog>

    <div id="toast" class="toast"></div>
    <script type="module" src="./assets/audio-asr.js"></script>
  </body>
  </html>
