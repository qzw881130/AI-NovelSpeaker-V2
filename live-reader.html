<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>直播阅读器 - AI NovelSpeaker V2</title>
    <meta name="theme-color" content="#f2e3cc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./live-reader.webmanifest" />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="main-nav" id="mainNav"></aside>
      <main class="page live-reader-page">
        <header class="page-header">
          <div>
            <h1 id="liveReaderPageTitle">直播阅读器</h1>
          </div>
          <div class="header-actions">
            <label class="header-novel-switch">切换小说
              <select id="liveReaderNovelSelect"></select>
            </label>
            <a class="ghost-btn" href="./chapters.html">返回章节管理</a>
            <button id="refreshLiveReaderBtn" class="primary-btn" type="button">刷新</button>
          </div>
        </header>

        <section class="panel live-reader-controls-panel">
          <div class="panel-head">
            <div class="panel-head-title-row">
              <h2>播放控制</h2>
            </div>
            <div class="panel-head-actions">
              <button id="toggleLiveReaderControlsBtn" class="ghost-btn" type="button">收起</button>
            </div>
          </div>
          <div id="liveReaderControlsBody" class="live-reader-controls-grid">
            <div class="live-reader-toggles-col">
              <label class="inline-check">
                <input id="liveReaderAutoNext" type="checkbox" checked />
                <span>自动下一回</span>
              </label>
              <label class="inline-check">
                <input id="liveReaderAutoScroll" type="checkbox" checked />
                <span>自动滚动正文</span>
              </label>
              <label class="inline-check">
                <input id="liveReaderHighlight" type="checkbox" checked />
                <span>逐段高亮</span>
              </label>
              <label class="inline-check">
                <input id="liveReaderIllustrations" type="checkbox" />
                <span>开启插画</span>
              </label>
            </div>
            <label class="live-reader-slider-control">
              正文宽度
              <input id="liveReaderWidthRange" type="range" min="140" max="900" step="10" value="520" />
              <span id="liveReaderWidthValue" class="reader-status">520px</span>
            </label>
            <label class="live-reader-slider-control">
              正文高度
              <input id="liveReaderHeightRange" type="range" min="320" max="1200" step="10" value="820" />
              <span id="liveReaderHeightValue" class="reader-status">820px</span>
            </label>
            <label class="live-reader-slider-control">
              字号
              <input id="liveReaderFontSizeRange" type="range" min="18" max="42" step="1" value="28" />
              <span id="liveReaderFontSizeValue" class="reader-status">28px</span>
            </label>
            <label class="live-reader-slider-control">
              高亮强度
              <input id="liveReaderHighlightIntensityRange" type="range" min="0" max="100" step="1" value="45" />
              <span id="liveReaderHighlightIntensityValue" class="reader-status">45%</span>
            </label>
            <label class="live-reader-slider-control">
              滚动灵敏度
              <input id="liveReaderFollowSensitivityRange" type="range" min="0" max="240" step="5" value="60" />
              <span id="liveReaderFollowSensitivityValue" class="reader-status">60px</span>
            </label>
            <label class="live-reader-slider-control">
              滚动平滑度
              <input id="liveReaderFollowSmoothnessRange" type="range" min="10" max="100" step="5" value="45" />
              <span id="liveReaderFollowSmoothnessValue" class="reader-status">45%</span>
            </label>
            <label class="live-reader-slider-control">
              顶部安全区
              <input id="liveReaderTopSafeOffsetRange" type="range" min="0" max="360" step="4" value="72" />
              <span id="liveReaderTopSafeOffsetValue" class="reader-status">72px</span>
            </label>
            <div class="live-reader-theme-control">
              <span>阅读配色</span>
              <div class="live-reader-theme-row">
                <select id="liveReaderThemeSelect"></select>
                <button id="liveReaderResetThemeBtn" class="ghost-btn icon-btn" type="button" aria-label="还原默认配色" title="还原默认配色">↻</button>
              </div>
              <span id="liveReaderThemeValue" class="reader-status">羊皮纸暖白</span>
              <div id="liveReaderThemePreview" class="live-reader-theme-preview" aria-hidden="true"></div>
            </div>
            <button id="liveReaderInstallBtn" class="ghost-btn hidden" type="button">安装独立阅读器</button>
          </div>
        </section>

        <section class="live-reader-layout">
          <aside class="panel live-reader-playlist-panel">
            <div class="panel-head">
              <div class="panel-head-title-row">
                <h2>章回播放列表</h2>
                <span id="liveReaderPlaylistCount" class="roles-filtered-count">0 回</span>
              </div>
            </div>
            <div id="liveReaderPlaylist" class="live-reader-playlist"></div>
          </aside>

          <button
            id="toggleLiveReaderPlaylistBtn"
            class="live-reader-playlist-toggle"
            type="button"
            aria-label="收起章回播放列表"
            title="收起章回播放列表"
            aria-expanded="true"
          >◀</button>

          <section class="panel live-reader-main-panel">
            <div class="live-reader-main-head">
              <div>
                <h2 id="liveReaderChapterTitle">请选择章回</h2>
                <div class="live-reader-meta-row">
                  <div id="liveReaderChapterMeta" class="meta"></div>
                  <span id="liveReaderStatus" class="reader-status">就绪</span>
                  <span id="liveReaderMatchStatus" class="reader-status">-</span>
                  <div class="live-reader-ending-controls">
                    <select id="liveEndingAudioSelect" class="hidden"></select>
                    <button id="refreshLiveEndingAudioBtn" class="ghost-btn icon-btn hidden" type="button" aria-label="刷新结束语列表" title="刷新结束语列表">↻</button>
                    <button id="liveEndingAudioPlayBtn" class="ghost-btn hidden" type="button">播放直播结束语</button>
                  </div>
                </div>
              </div>
              <div class="chapter-nav-controls">
                <button id="liveReaderPrevBtn" class="ghost-btn" type="button">上一回</button>
                <button id="liveReaderNextBtn" class="ghost-btn" type="button">下一回</button>
              </div>
            </div>
            <div class="live-reader-audio-wrap">
              <audio id="liveReaderAudioPlayer" controls preload="metadata"></audio>
              <audio id="liveEndingAudioPlayer" class="hidden" preload="auto"></audio>
            </div>
            <div id="liveReaderFrameTitle" class="live-reader-frame-title">-</div>
            <div id="liveReaderProgressTrack" class="live-reader-progress-track" aria-hidden="true">
              <div id="liveReaderProgressFill" class="live-reader-progress-fill"></div>
            </div>
            <div class="live-reader-reader-wrap">
              <article id="liveReaderContent" class="live-reader-content">请先选择章回。</article>
            </div>
            <div id="liveReaderIllustrationBox" class="live-reader-illustration-box hidden">
              <div id="liveReaderIllustrationMeta" class="meta">插画未开启</div>
              <div class="live-reader-illustration-stage">
                <img id="liveReaderIllustrationImage" alt="章节插画" />
                <span id="liveReaderIllustrationTime" class="live-reader-illustration-badge live-reader-illustration-time"></span>
                <span id="liveReaderIllustrationTitle" class="live-reader-illustration-badge live-reader-illustration-title"></span>
              </div>
            </div>
          </section>
        </section>
      </main>
    </div>

    <div id="toast" class="toast"></div>
    <script type="module" src="./assets/live-reader.js"></script>
  </body>
</html>
